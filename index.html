        body {
            margin: 0;

            touch-action: none;

        }
        canvas {
            display: block;
            touch-action: none;
        }
        /* Specialized container for NippleJS */
        .joystick-zone {
            width: 140px;
            height: 140px;
            pointer-events: auto;
            position: relative;
        }
        .nipple {
            opacity: 0.8 !important;
        }
